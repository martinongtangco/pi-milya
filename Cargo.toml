[package]
name = "pi-milya"
version = "0.1.0"
edition = "2024"

[lib]
name = "pi_milya"
path = "src/lib.rs"

[[bin]]
name = "pi-milya"
path = "src/main.rs"

[[bin]]
name = "pi-milya-gui"
path = "src/gui_main.rs"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "signal", "time"] }
eframe = "0.29"
pulldown-cmark = "0.12"
